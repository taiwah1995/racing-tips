<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>賽馬貼士 · DEMO</title>
  <link rel="stylesheet" href="css/styles.css?v=20260920c" />
</head>
<body>
  <div id="app">
    <header class="site-header">
      <div class="header-inner">
        <button id="btn-back" class="btn-back" type="button" aria-label="返回" hidden>←</button>
        <div class="header-titles">
          <h1 id="page-title">🏇 賽馬貼士</h1>
          <p id="page-sub" class="subtitle">貼士存檔 · DEMO</p>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- HOME VIEW -->
      <section id="view-home" class="view">
        <div class="filters">
          <div class="venue-tabs" role="tablist">
            <button class="tab active" data-venue="all" type="button">全部</button>
            <button class="tab" data-venue="ST" type="button">沙田</button>
            <button class="tab" data-venue="HV" type="button">快活谷</button>
          </div>
          <label class="search-wrap">
            <span class="sr-only">搜尋馬名</span>
            <input id="search-horse" type="search" placeholder="搜尋馬名…" autocomplete="off" />
          </label>
        </div>
        <ul id="meeting-list" class="meeting-list" aria-live="polite"></ul>
        <p id="home-empty" class="empty" hidden>找不到符合條件的賽日</p>
      </section>

      <!-- DETAIL VIEW -->
      <section id="view-detail" class="view" hidden>
        <div id="detail-meta" class="detail-meta" hidden></div>

        <div class="panel">
          <h2 class="panel-title">🏆 全日重心馬匹數據表</h2>
          <div class="table-scroll">
            <table class="tips-table" id="tips-table">
              <thead>
                <tr>
                  <th>場次</th>
                  <th>首選</th>
                  <th>次選</th>
                  <th>三選</th>
                  <th>冷腳</th>
                </tr>
              </thead>
              <tbody id="tips-tbody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">🏆 全日重心馬推介</h2>
          <p class="panel-hint">每日 3 隻</p>
          <div id="daily-picks" class="daily-picks"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      DEMO · 僅供參考 · 非投注建議
    </footer>
  </div>
  <script src="js/app.js?v=20260920c"></script>
</body>
</html>
